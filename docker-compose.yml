services:
  database:
    image: postgres:16-alpine
    container_name: personel-finance-postgres
    environment:
      POSTGRES_DB: PersonelFinanceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: